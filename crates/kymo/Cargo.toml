[package]
name = "kymo"
description = "Viewer for large EEG/MEG recordings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The icon and version information as resources in kymo.exe (build.rs; Windows only).
[build-dependencies]
winresource = "0.1"

# The binary only dispatches the parsed command; its parts are tested in the library.
[[bin]]
name = "kymo"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1"
bytemuck.workspace = true
eframe.workspace = true
jiff.workspace = true
kymo-core.workspace = true
rfd.workspace = true
semver.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
winit.workspace = true

# The System theme on Linux (and the other Unix systems winit runs on): the desktop portal's
# color-scheme over D-Bus. Already pulled in by eframe (accessibility).
# The test of the open-files method sends it to a class of its own.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-foundation.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
zbus = { workspace = true, features = ["p2p"] }

[target.'cfg(windows)'.dependencies]
muda.workspace = true
windows-sys.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
egui_system_font_provider.workspace = true
kymo-core = { workspace = true, features = ["testing"] }
kymo-testgen.workspace = true
pollster.workspace = true
proptest.workspace = true

[lints]
workspace = true

# Peak resident memory for the frames benchmark.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "frames"
harness = false
