[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
repository = "https://github.com/cbrnr/kymo"
authors = ["Clemens Brunner <clemens.brunner@gmail.com>"]

[workspace.dependencies]
kymo-core = { path = "crates/kymo-core" }
kymo-testgen = { path = "crates/kymo-testgen" }
blake3 = "1.8"
# Already pulled in by egui-wgpu; GPU structs as bytes.
bytemuck = { version = "1.25", features = ["derive"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# Annotation files: quoting and line breaks in fields.
csv = "1.4"
dirs = "7"
# With persistence: settings and the window's size are kept between runs.
eframe = { version = "0.37", features = ["persistence"] }
# Headless UI tests.
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
# The system font fallback eframe installs, for the same glyphs in headless UI tests.
egui_system_font_provider = "0.37"
# macOS only, already pulled in by rfd; opens the startup file dialog on the main queue.
dispatch2 = "0.3.1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
memmap2 = "0.9"
# Native menu bars on macOS and Windows; default features (GTK) are Linux-only and unused.
muda = { version = "0.21", default-features = false }
# macOS only, already pulled in by objc2-app-kit; adds the method that receives files from
# Finder to winit's app delegate.
objc2 = "0.6.5"
# macOS only, already pulled in by eframe; names the process for the app menu and reads the
# files Finder hands over.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSProcessInfo", "NSString", "NSURL"] }
# macOS only, already pulled in by winit; lets the menus take the theme setting and reads
# the accent color.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSAppearance", "NSApplication", "NSColor", "NSColorSpace", "NSResponder"] }
pollster = "1.0"
proptest = "1"
rfd = "0.17.2"
# macOS only, already pulled in by eframe (the same version and features): Kymo builds the
# event loop itself there, to add the open-files method to winit's app delegate before it runs.
winit = { version = "0.30.13", default-features = false }
# BVRF headers (JSON); already in the lock file through criterion.
serde_json = "1.0"
# Check for Updates: version numbers, and the latest release from GitHub's API over rustls
# (no OpenSSL) with Mozilla's root certificates.
semver = "1"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
thiserror = "2"
# Linux only, already pulled in by eframe; reads the System theme from the desktop portal.
zbus = "5"
# Windows only, already pulled in by muda; lets the menus follow the theme, the System theme
# the default app mode, and the command line print to the terminal it was started from.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
# `unsafe` is only allowed where unavoidable (memory mapping), opted in locally with a SAFETY comment.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
# Lists of sample ranges (segments) are a core type here; `vec![0..n]` is meant as one range.
single_range_in_vec_init = "allow"

[profile.release]
debug = "line-tables-only"

# Tests and debug runs: optimized dependencies (egui, wgpu) draw and link much faster, and
# the tests' builds and brute-force checks run several times faster at level 1, which
# leaves incremental builds of kymo-core and kymo as quick as at level 0.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.kymo-core]
opt-level = 1

[profile.dev.package.kymo]
opt-level = 1
